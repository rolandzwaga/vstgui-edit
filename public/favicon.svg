<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#1a1a2e"/>

  <!-- Grid lines -->
  <g stroke="#3a3a5e" stroke-width="0.5">
    <line x1="8" y1="4" x2="8" y2="28"/>
    <line x1="16" y1="4" x2="16" y2="28"/>
    <line x1="24" y1="4" x2="24" y2="28"/>
    <line x1="4" y1="8" x2="28" y2="8"/>
    <line x1="4" y1="16" x2="28" y2="16"/>
    <line x1="4" y1="24" x2="28" y2="24"/>
  </g>

  <!-- Selected view rectangle -->
  <rect x="6" y="10" width="14" height="10" fill="#4a90d9" fill-opacity="0.3" stroke="#4a90d9" stroke-width="1.5"/>

  <!-- Selection handles -->
  <rect x="4" y="8" width="4" height="4" fill="#fff" rx="0.5"/>
  <rect x="18" y="8" width="4" height="4" fill="#fff" rx="0.5"/>
  <rect x="4" y="18" width="4" height="4" fill="#fff" rx="0.5"/>
  <rect x="18" y="18" width="4" height="4" fill="#fff" rx="0.5"/>

  <!-- Secondary view hint -->
  <rect x="22" y="18" width="6" height="8" fill="none" stroke="#6a6a8e" stroke-width="1" stroke-dasharray="2,1"/>
</svg>
